<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello!</title>
  <style>
    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 68px;
      font-weight: bold;
      color: #da8585d5;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    p {
      font-size: 24px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      margin-bottom: 40px;
    }

    .read-btn {
      background-color: #8B0A1A;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      text-decoration: none;
      display: inline-block;
    }

    .read-btn:hover {
      background-color: #9B1C2A;
    }

    .timer {
      position: fixed;
      bottom: 0;
      left: 0;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      font-size: 18px;
    }

  </style>
</head>

<body background="bg.jpeg">
  <div class="container">
    <h1>Hello Madam Ji!</h1>
    <p>Apke liye duur se ek chitthi aayi hai</p>
    <a href="2_test.html" target="_blank" class="read-btn">READ CHITTHI</a>
  </div>

  <div class="timer" id="timer"></div>
  <script>
    
    const startTime = new Date('2021-08-23T22:20:00').getTime();
    const timerElement = document.getElementById('timer');

    function updateTimer() {
      const currentTime = new Date().getTime();
      const diffTime = currentTime - startTime;

      const years = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 365));
      const days = Math.floor((diffTime % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diffTime % (1000 * 60)) / 1000);

      timerElement.innerHTML = `
        We've known each other for: ${years} years, ${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds
      `;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>

</body>

</html>
