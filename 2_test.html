<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter</title>
    <style>
        body {
            background-color: #ffcccc;
            font-family: 'Pacifico', cursive;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        #reveal-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #ff99cc;
            color: #9403d2;
            border: none;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        #reveal-btn:hover {
            background-color: #ff69b4;
        }



        #letter-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 2s;
            width: 1000px;
        }

        #image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);

        }

        #letter {
            font-size: 24px;
            color: #ff0404;
            text-shadow: 0 0 5px rgba(48, 39, 39, 0.616);
        }

        #proceed {
            background-color: #8B0A1A;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            display: inline-block;
        }

        #proceed:hover
        {
            background-color: #9B1C2A;
        }

    </style>
</head>

<body>
    <button id="reveal-btn">REVEAL</button>
    <div id="letter-container">
        <img src="" id="image">
        <p id="letter"></p>
        <a id="proceed" href="1_test.html" target="_blank">PROCEED FURTHER</a>
    </div>

    <script>
        const revealBtn = document.getElementById('reveal-btn');
        const letterContainer = document.getElementById('letter-container');
        const image = document.getElementById('image');
        const letter = document.getElementById('letter');

        revealBtn.addEventListener('click', () => {
            revealBtn.style.display = 'none';
            letterContainer.style.opacity = 1;
            image.src = 'cake.gif';
            letter.innerHTML = 'Happy 19th Birthday Chinmayee!<br>Ache se enjoy karna aaj ka din, sath mein thoda mere sath bhi baat kar lena🥲<br>Tumhe itne salon se nahi dekha and baat bhi nahi karte jyada bahat miss karta hoon🥲Puchne se kab aoge bolte ho kabhi nahi. Aise kaise chalega!!<br>And tum abhi bhi best person ho mere liye aur hamesha aage bhi rahoge chahe tum future mein kabhi baat karna bandh bhi kardo. Par kabhi aisa karna mat kuch bhi problem hue to clear karo usko, dant lo mujhe par chhod k mat jana kabhi, wo seh nahi sakta. Reels mein bhale majak majak mein bhej deta hoon bahat kuch bt deep down I really mean them👉👈.Yess!I really love you and always will no matter what. Ab jyada likhunga toh cry aa jayega. And tum jab ladko k sath stories/post dalte ho main sad sad ho jata hoon(for obvious reasons)reason nahi puchna<br>Lastly HAPPIEST BIRTHDAY TO THE BEST PERSON OF MY LIFE❤<br><br>PS: You always my jaanu👉👈';
        });
    </script>
</body>

</html>
